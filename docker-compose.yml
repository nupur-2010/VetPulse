version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vetpulse-postgres
    environment:
      POSTGRES_USER: vetpulse
      POSTGRES_PASSWORD: vetpulse_secret_password
      POSTGRES_DB: vetpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vetpulse-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vetpulse:vetpulse_secret_password@postgres:5432/vetpulse
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      AI_SERVICE_URL: http://ai-service:8000
      AI_PROVIDER: mock
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run dev

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: vetpulse-ai-service
    environment:
      AI_PROVIDER: mock
      MODEL_PATH: /app/model
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./apps/ai-service:/app
      - ai_model_data:/app/model
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: vetpulse-web
    environment:
      VITE_API_URL: http://api:3001
      VITE_AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  ai_model_data:
